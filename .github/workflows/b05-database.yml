name: Schema stack database integration (b05, a05)

on:
  pull_request:
    paths:
      - "supabase/migrations/202611*.sql"
      - "supabase/migrations/20260703180000_exam_reminders.sql"
      - "scripts/sql/track-b/b05-key-change-trigger/**"
      - "scripts/regenerate_ai_explanations.py"
      - "tests/unit/track-b/b05-key-change-trigger/**"
      - "tests/unit/a05-data-proof/**"
      - "src/app/api/ai-chat/route.ts"
      - "src/app/api/translate/route.ts"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - ".github/workflows/b05-database.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-b05:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Provision PostgreSQL 16 binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Cache-writer units (no database required)
        run: npm run test:unit -- tests/unit/ai-chat/route.test.ts tests/unit/legacy-ai/translate-route.test.ts tests/unit/track-b/b05-key-change-trigger/regeneration-writer.test.ts
      - name: Migration, cache races, privileges and rollback
        run: npm run test:db:b05
        env:
          B05_PG_BIN: /usr/lib/postgresql/16/bin
      - name: Full 202611 schema stack, ADM-Q13 invalidation and reverse rollback
        run: npm run test:db:a05
        env:
          A05_PG_BIN: /usr/lib/postgresql/16/bin
