name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Minimal env vars so the build doesn't fail on missing
          # Supabase/Telegram secrets (those are only needed at runtime).
          # The supabase.ts guard handles missing vars gracefully.
          NEXT_PUBLIC_SITE_URL: https://medpruf.com
