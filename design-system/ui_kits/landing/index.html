<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>MedPrüf — Landing UI Kit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; background: #fff; color: #1A2B3C; font-family: var(--mp-font-body); }
    * { box-sizing: border-box; }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #003A8C; color: #fff; font-weight: 600; border-radius: 10px; padding: 10px 18px; border: 0; cursor: pointer; font-size: 13px; box-shadow: 0 1px 2px rgba(0,27,61,.03); transition: all 200ms var(--mp-ease-out); }
    .btn-primary:hover { background: #002d6e; }
    .btn-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; color: #1A2B3C; font-weight: 500; border-radius: 12px; padding: 13px 22px; border: 1px solid #E4E9F0; cursor: pointer; font-size: 14px; transition: all 200ms var(--mp-ease-out); }
    .btn-secondary:hover { background: #F7F9FC; border-color: #A0AEC0; }
    .card { background: #fff; border-radius: 14px; border: 1px solid rgba(228,233,240,.7); box-shadow: 0 1px 3px rgba(0,27,61,.05); }
    .card-interactive { background: #fff; border-radius: 14px; border: 1px solid rgba(228,233,240,.7); box-shadow: 0 1px 3px rgba(0,27,61,.05); transition: all 200ms var(--mp-ease-out); }
    .card-interactive:hover { box-shadow: 0 4px 12px rgba(0,27,61,.08); transform: translateY(-2px); border-color: #E4E9F0; }
    @keyframes cta-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .cta-shimmer-landing { background: linear-gradient(90deg, #007B5F 0%, #00A896 50%, #007B5F 100%); background-size: 200% 100%; animation: cta-shimmer 3s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../web_app/Primitives.jsx"></script>
  <script type="text/babel" src="./Hero.jsx"></script>
  <script type="text/babel" src="./Sections.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <>
          <LandingNav />
          <Hero />
          <Features />
          <Subjects />
          <Pricing />
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
