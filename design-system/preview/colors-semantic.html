<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-family:var(--mp-font-body)}
.sw{border-radius:12px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--mp-shadow-card)}
.sw .name{font-size:12px;font-weight:600}
.sw .hex{font-family:var(--mp-font-mono);font-size:10px;opacity:.85}
</style></head><body>
<div class="sw" style="background:#00A896;color:#fff"><div class="name">Accent Teal</div><div class="hex">#00A896</div></div>
<div class="sw" style="background:#F4A261;color:#1A2B3C"><div class="name">Warning</div><div class="hex">#F4A261</div></div>
<div class="sw" style="background:#D64545;color:#fff"><div class="name">Error</div><div class="hex">#D64545</div></div>
<div class="sw" style="background:#3A7CA5;color:#fff"><div class="name">Info</div><div class="hex">#3A7CA5</div></div>
</body></html>
