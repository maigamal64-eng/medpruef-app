<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-family:var(--mp-font-body)}
.sw{border-radius:10px;padding:10px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #E4E9F0}
.sw .name{font-size:11px;font-weight:600;color:#1A2B3C}
.sw .hex{font-family:var(--mp-font-mono);font-size:10px;color:#4A5568}
</style></head><body>
<div class="sw" style="background:#F7F9FC"><div class="name">Background</div><div class="hex">#F7F9FC</div></div>
<div class="sw" style="background:#FFFFFF"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div>
<div class="sw" style="background:#E4E9F0"><div class="name">Border</div><div class="hex">#E4E9F0</div></div>
<div class="sw" style="background:#1A2B3C;color:#fff"><div class="name" style="color:#fff">Text</div><div class="hex" style="color:#E2E8F0">#1A2B3C</div></div>
<div class="sw" style="background:#4A5568;color:#fff"><div class="name" style="color:#fff">Muted</div><div class="hex" style="color:#E2E8F0">#4A5568</div></div>
</body></html>
