<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body style="margin:0;padding:20px;background:#fff;font-family:var(--mp-font-body)">
<div style="display:flex;gap:12px;align-items:center">
  <button class="btn-p" style="background:#003A8C;color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600;font-size:14px;box-shadow:0 1px 2px rgba(0,27,61,.03),inset 0 1px 0 rgba(255,255,255,.1);cursor:pointer">Jetzt lernen</button>
  <button style="background:#fff;color:#1A2B3C;border:1px solid #E4E9F0;border-radius:10px;padding:8px 16px;font-weight:500;font-size:14px;box-shadow:0 1px 2px rgba(0,27,61,.03);cursor:pointer">Prüfung wählen</button>
  <button style="background:#00A896;color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer">Weiter →</button>
  <button disabled style="background:#003A8C;color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600;font-size:14px;opacity:.45;cursor:not-allowed">Laden…</button>
</div>
<div style="margin-top:10px;font-family:var(--mp-font-mono);font-size:10px;color:#A0AEC0">.btn-primary · .btn-secondary · .btn-success · disabled</div>
</body></html>
