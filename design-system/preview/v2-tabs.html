<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../components_v2.css">
</head>
<body style="margin:0;padding:32px;background:#F7F9FC;font-family:var(--mp-font-body);display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span class="mp-caption" style="min-width:100px">Segmented</span>
    <div class="mp-tabs">
      <button class="mp-tabs__tab mp-tabs__tab--active">Alle</button>
      <button class="mp-tabs__tab">Gemerkt</button>
      <button class="mp-tabs__tab">Fehler</button>
      <button class="mp-tabs__tab">Notizen</button>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span class="mp-caption" style="min-width:100px">Count badge</span>
    <div class="mp-tabs">
      <button class="mp-tabs__tab mp-tabs__tab--active">Innere <span style="font-family:var(--mp-font-mono);color:var(--mp-viridian);margin-left:4px">247</span></button>
      <button class="mp-tabs__tab">Chirurgie <span style="font-family:var(--mp-font-mono);color:var(--mp-fg-subtle);margin-left:4px">182</span></button>
      <button class="mp-tabs__tab">Pädiatrie <span style="font-family:var(--mp-font-mono);color:var(--mp-error);margin-left:4px">43</span></button>
    </div>
  </div>

  <div>
    <span class="mp-caption" style="display:block;margin-bottom:10px">Underline (for content sections)</span>
    <div style="border-bottom:1px solid var(--mp-border);display:flex;gap:24px">
      <button style="background:none;border:none;padding:12px 2px;font-weight:700;font-size:14px;color:var(--mp-oxford-blue);border-bottom:2px solid var(--mp-viridian);margin-bottom:-1px;cursor:pointer">Überblick</button>
      <button style="background:none;border:none;padding:12px 2px;font-weight:500;font-size:14px;color:var(--mp-fg-muted);cursor:pointer">Themen</button>
      <button style="background:none;border:none;padding:12px 2px;font-weight:500;font-size:14px;color:var(--mp-fg-muted);cursor:pointer">Statistik</button>
      <button style="background:none;border:none;padding:12px 2px;font-weight:500;font-size:14px;color:var(--mp-fg-muted);cursor:pointer">Lesezeichen</button>
    </div>
  </div>
</body></html>
