<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:#0F172A;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-family:var(--mp-font-body)}
.sw{border-radius:12px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.06)}
.sw .name{font-size:11px;font-weight:600;color:#E2E8F0}
.sw .hex{font-family:var(--mp-font-mono);font-size:10px;color:#94A3B8}
</style></head><body>
<div class="sw" style="background:#0F172A"><div class="name">bg</div><div class="hex">#0F172A</div></div>
<div class="sw" style="background:#1E293B"><div class="name">surface</div><div class="hex">#1E293B</div></div>
<div class="sw" style="background:#334155"><div class="name">raised / border</div><div class="hex">#334155</div></div>
<div class="sw" style="background:#E2E8F0"><div class="name" style="color:#1A2B3C">text</div><div class="hex" style="color:#4A5568">#E2E8F0</div></div>
</body></html>
