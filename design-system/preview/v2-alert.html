<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../components_v2.css">
</head>
<body style="margin:0;padding:32px;background:#F7F9FC;font-family:var(--mp-font-body);display:flex;flex-direction:column;gap:12px;max-width:480px">
  <div class="mp-alert mp-alert--info">
    <svg class="mp-alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <div><div class="mp-alert__title">Neu in v2.3</div><div class="mp-alert__body">Lernpläne berechnen jetzt pro Thema, nicht nur global.</div></div>
  </div>
  <div class="mp-alert mp-alert--success">
    <svg class="mp-alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <div><div class="mp-alert__title">Alle 60 Fragen beantwortet</div><div class="mp-alert__body">Du bist bereit für die Probeprüfung.</div></div>
  </div>
  <div class="mp-alert mp-alert--warning">
    <svg class="mp-alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div><div class="mp-alert__title">Schwaches Thema: Pädiatrie</div><div class="mp-alert__body">32% Genauigkeit · Jetzt wiederholen spart dir ~40 Punkte im Exam.</div></div>
  </div>
  <div class="mp-alert mp-alert--error">
    <svg class="mp-alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    <div><div class="mp-alert__title">Streak beendet</div><div class="mp-alert__body">Keine Panik — starte heute neu und behalte deine XP.</div></div>
  </div>
</body></html>
