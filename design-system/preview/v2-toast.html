<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../components_v2.css">
</head>
<body style="margin:0;padding:24px;background:#F7F9FC;font-family:var(--mp-font-body);display:flex;flex-direction:column;gap:12px;align-items:flex-start">
  <div class="mp-toast mp-toast--success">
    <span class="mp-toast__icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
    <div>Notiz gespeichert · <span style="color:#A0AEC0;font-weight:400">Kardiologie Frage 142</span></div>
  </div>
  <div class="mp-toast mp-toast--warning">
    <span class="mp-toast__icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
    <div>Streak endet in 3h 14min</div>
    <button style="margin-left:auto;background:var(--mp-viridian);color:white;border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">Jetzt lernen</button>
  </div>
  <div class="mp-toast mp-toast--error">
    <span class="mp-toast__icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
    <div>Verbindung verloren · <span style="color:#A0AEC0;font-weight:400">Antwort wird gespeichert, sobald online</span></div>
  </div>
  <div class="mp-toast" style="background:var(--mp-surface);color:var(--mp-fg);border:1px solid var(--mp-border)">
    <span class="mp-toast__icon" style="background:var(--mp-cta-blue)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <div>+25 XP verdient · <span style="font-family:var(--mp-font-mono);color:var(--mp-fg-subtle)">Level 4 → 5</span></div>
  </div>
</body></html>
