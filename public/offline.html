<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>MedPrüf ist offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f7f8fa; color: #18212f; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #dce2e8; border-radius: 20px; background: #fff; box-shadow: 0 16px 48px #14203314; }
      img { width: 44px; height: 44px; }
      h1 { margin: 24px 0 12px; font-size: clamp(1.5rem, 7vw, 2rem); line-height: 1.15; }
      p { color: #465365; line-height: 1.65; }
      a { display: inline-block; margin-top: 12px; padding: 12px 16px; border-radius: 10px; background: #176b62; color: #fff; text-decoration: none; font-weight: 700; }
      @media (max-width: 420px) { main { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-mark.png" alt="" />
      <h1>Du bist gerade offline.</h1>
      <p>Dein Konto bleibt geschützt. Sobald du wieder online bist, kannst du MedPrüf öffnen. Heruntergeladene Fragen findest du in der App unter Einstellungen.</p>
      <a href="/quiz">Erneut versuchen</a>
    </main>
  </body>
</html>
