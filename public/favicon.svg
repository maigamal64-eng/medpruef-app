<?xml version="1.0" encoding="UTF-8"?>
<!--
  MedPrüf favicon — refined 2026-06-04 (brand sweep).
  The ü-as-stethoscope mark on a rounded navy tile so the two teal
  "umlaut" dots stay legible at 16px (on a transparent ground they
  disappear into light browser chrome). Light/dark aware: on a dark
  OS the tile lightens just enough to keep contrast.
  Original transparent mark preserved at /brand/logomark.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <style>
    .tile { fill: #001B3D; }
    .mark { fill: #FFFFFF; }
    .dot  { fill: #00A896; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0F1E36; }
      .mark { fill: #E8EEF6; }
      .dot  { fill: #1FC2A6; }
    }
  </style>
  <rect class="tile" x="0" y="0" width="500" height="500" rx="112" ry="112"/>
  <!-- ü-stethoscope mark, scaled ~1.18x about center (250,260) to fill the tile -->
  <g class="mark" transform="translate(250 260) scale(1.18) translate(-250 -260)">
    <path d="M251.6,339.9c11.2-.7,21.3-3.7,30.3-10.3,8.9-6.5,15.3-15.2,19.5-25.4,2.3-6.7,3.7-13,3.9-20.1v-61.8s18-20.8,18-20.8c1.1-1.2,1.6-2.7,3.8-3.6v88.6c-.6,18.1-7,34.5-18.8,48.1-14.4,16.4-34.5,26.1-56.7,26.4v-21.1Z"/>
    <path d="M248.3,360.8c-5.6.3-10.9-.8-16.6-1.9-4.7-1-9-2.8-13.6-4.7-6.3-3-11.7-6.5-17-10.6-5-4.5-9.5-9.2-13.6-14.5-9.5-13.5-14.7-29-14.7-45.9v-85.2c.9,0,1.4.8,2,1.4l19.8,22.8v61.1c.3,21.1,11.5,39.9,29.7,50,7.5,4,15.2,6.1,23.8,6.4l.2,21Z"/>
    <path d="M272.7,331.2c-7,3.3-13.6,5.3-21.1,5.1v-21.1c6-.5,11.3-2.2,15.9-5.6,8.3-6.1,12.8-15.4,12.6-25.7v-85.9c0,0,13,14.3,13,14.3l8.8,10.2v56.8c.3,9.9-1.1,19.1-5.6,28.1-5.2,10.4-13,18.5-23.6,23.8Z"/>
    <path d="M248.1,336.3c-11.6-.2-21.9-4.6-30.6-11.6-6.9-5.7-11.9-12.9-15.4-21.3-2.6-6-3.5-11.9-3.9-18.5v-62.4c0,0,13.7-15.9,13.7-15.9,2.7-2.9,4.6-6.1,8-8.8v83.8c0,5.2.7,9.8,2.4,14.5,2.7,6.7,7.5,11.9,13.6,15.5,3.7,2.1,7.7,2.9,12.1,3.6v21.1Z"/>
    <polygon points="303.6 219.3 287.4 201.2 282.7 194.9 324.7 195 303.6 219.3"/>
    <polygon points="196.3 219.3 180.1 201.2 175.4 194.9 217.4 195 196.3 219.3"/>
  </g>
  <g class="dot" transform="translate(250 260) scale(1.18) translate(-250 -260)">
    <circle cx="198.6" cy="159.1" r="22.4"/>
    <circle cx="300.9" cy="159.1" r="22.4"/>
  </g>
</svg>
